site_name: AI Coding Agent ROI Toolkit
site_description: Measure AI coding agent adoption and prove ROI — a practical guide for engineering leaders
site_url: "https://devexpgbb.github.io/copilot-metrics-roi-toolkit/"
repo_url: https://github.com/DevExpGBB/copilot-metrics-roi-toolkit
repo_name: DevExpGBB/copilot-metrics-roi-toolkit

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search

nav:
  - Start Here:
    - Overview: index.md
    - Measurement Journey: measurement-journey.md
  - Adoption:
    - Overview: adoption/index.md
    - Quick Start: adoption/quick-start.md
    - Metrics Guide: adoption/metrics.md
    - Analytics-Ready: adoption/analytics-ready.md
    - Tools & Resources: adoption/tools.md
  - Impact & ROI:
    - Overview: impact/index.md
    - Metrics Guide: impact/metrics.md
    - ROI Framework: impact/roi-framework.md
    - Using Apache DevLake: impact/apache-devlake.md
    - Tools & Resources: impact/tools.md
  - Templates:
    - Overview: exec-templates/index.md
    - KPI Table: exec-templates/kpi-table.md
    - ROI One-Pager: exec-templates/roi-one-pager.md
    - QBR Outline: exec-templates/qbr-outline.md
    - Measurement Plan: exec-templates/measurement-plan.md
    - Artifact Maintenance Workflow: exec-templates/artifact-maintenance.md
  - Reference:
    - Overview: reference/index.md
    - Dashboards & Data Sources: dashboards-data-sources.md
    - Tool Catalog: tool-catalog.md
    - FAQ & Glossary: faq-glossary.md
    - References: references.md
